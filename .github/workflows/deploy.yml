name: Deploy Beptyxa Frontend to Server

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:run
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROJECT_DIR: '/projects/${{ github.event.repository.name }}'
          REPO_URL: 'https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git'

          SERVER_NAME: ${{ secrets.SERVER_NAME }}
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          FRONTEND_BIND: ${{ secrets.FRONTEND_BIND }}
          BACKEND_CONTAINER_NAME: ${{ secrets.BACKEND_CONTAINER_NAME }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: PROJECT_DIR,REPO_URL,SERVER_NAME,SITE_DOMAIN,FRONTEND_BIND,BACKEND_CONTAINER_NAME,BACKEND_PORT
          script: |
            if [ -z "$SITE_DOMAIN" ]; then
              echo "SITE_DOMAIN secret is not set"
              exit 1
            fi

            if [ ! -d "$PROJECT_DIR" ]; then
              mkdir -p /projects
              cd /projects
              git clone $REPO_URL $(basename $PROJECT_DIR)
            fi

            cd $PROJECT_DIR
            git fetch origin
            git reset --hard origin/main

            cat > .env <<ENVFILE
            SERVER_NAME=$SERVER_NAME
            SITE_DOMAIN=$SITE_DOMAIN
            FRONTEND_BIND=$FRONTEND_BIND
            BACKEND_CONTAINER_NAME=$BACKEND_CONTAINER_NAME
            BACKEND_PORT=$BACKEND_PORT
            ENVFILE

            docker-compose up -d --build

            docker image prune -f
